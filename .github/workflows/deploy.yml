name: Build, check, and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install ImageMagick (responsive images)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build -d _site

      - name: Purge unused CSS
        run: npx --yes purgecss -c purgecss.config.js

      # The same build is audited by the jobs below and, if they pass, deployed.
      - uses: actions/upload-artifact@v6
        with:
          name: site
          path: _site
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          name: site
          path: _site

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Accessibility must score 100 on the sampled pages; see lighthouserc.json.
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 30

  pa11y:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          name: site
          path: _site

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # WCAG 2 AA on every page in the sitemap, with both the HTML_CodeSniffer
      # and axe engines. Any error fails the build; see .pa11yci.js and bin/a11y.
      - name: Run pa11y-ci over the whole site
        run: bin/a11y

  deploy:
    needs: [build, lighthouse, pa11y]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
